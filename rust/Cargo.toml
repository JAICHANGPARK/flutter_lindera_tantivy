[package]
name = "flutter_lindera_tantivy"
version = "2026.7.26"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
tantivy = "0.25.0"
lindera = "4.0.1"
lindera-tantivy = { version = "4.0.0", features = [
    "embed-ipadic",
    #    "embed-ipadic-neologd",
    "embed-unidic",
    "embed-ko-dic",
    "embed-cc-cedict"
] }
serde_json = "1.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
